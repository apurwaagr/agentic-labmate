services:
  postgres:
    image: ghcr.io/raphaelmansuy/edgequake-postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: edgequake
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  edgequake:
    image: ghcr.io/raphaelmansuy/edgequake:latest
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/edgequake
      GEMINI_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_API_KEYS: ${GOOGLE_API_KEYS:-}
      EDGEQUAKE_DEFAULT_LLM_PROVIDER: gemini
      EDGEQUAKE_DEFAULT_LLM_MODEL: gemini-2.5-flash
      EDGEQUAKE_DEFAULT_EMBEDDING_PROVIDER: gemini
      EDGEQUAKE_DEFAULT_EMBEDDING_MODEL: gemini-embedding-001
      EDGEQUAKE_DEFAULT_EMBEDDING_DIMENSION: "3072"
      EDGEQUAKE_LLM_PROVIDER: gemini
      EDGEQUAKE_EMBEDDING_PROVIDER: gemini
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8083:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
